[project]
name = "parking-api-qa-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn==0.34.*",
    "httpx==0.28.*",
    "jsonschema==4.23.*",
]

[dependency-groups]
dev = ["pytest==8.*", "ruff==0.9.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
